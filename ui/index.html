<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al-Mustaqbal Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f1f3f6;
    --border: #e4e7ec;
    --text: #101828;
    --muted: #667085;
    --accent: #0e9384;
    --accent-soft: #ccfbef;
    --accent-ink: #ffffff;
    --user: #6172f3;
    --user-soft: #eef4ff;
    --danger: #d92d20;
    --danger-soft: #fef3f2;
    --radius: 20px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans Arabic", "Inter", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  html[lang="en"] body { font-family: "Inter", "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif; }
  button { font: inherit; cursor: pointer; }

  .app { max-width: 1120px; margin: 0 auto; padding: 20px 16px 32px; min-height: 100%; display: flex; flex-direction: column; gap: 20px; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { width: 44px; height: 44px; border-radius: 14px; background: var(--accent); display: grid; place-items: center; flex: none; }
  .brand h1 { font-size: 17px; margin: 0; font-weight: 700; line-height: 1.3; }
  .brand p { margin: 0; font-size: 13px; color: var(--muted); }
  .lang { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; flex: none; }
  .lang button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .lang button.active { background: var(--text); color: #fff; }

  /* Layout */
  main { display: grid; grid-template-columns: 1.1fr .9fr; gap: 20px; flex: 1; min-height: 0; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* Stage */
  .stage { padding: 28px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; min-height: 520px; position: relative; overflow: hidden; }
  .stage::before { content: ""; position: absolute; inset: 0; background:
      radial-gradient(600px 300px at 50% 0%, rgba(14,147,132,.08), transparent 70%),
      radial-gradient(400px 260px at 50% 100%, rgba(97,114,243,.06), transparent 70%); pointer-events: none; }
  .status { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 13px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #98a2b3; }
  .status[data-state="connecting"] .dot { background: #f79009; animation: pulse 1s infinite; }
  .status[data-state="connected"] { background: var(--accent-soft); color: #107569; }
  .status[data-state="connected"] .dot { background: var(--accent); }
  .status[data-state="listening"] { background: var(--user-soft); color: #3538cd; }
  .status[data-state="listening"] .dot { background: var(--user); animation: pulse 1s infinite; }
  .status[data-state="speaking"] { background: var(--accent-soft); color: #107569; }
  .status[data-state="speaking"] .dot { background: var(--accent); animation: pulse .6s infinite; }
  .status[data-state="error"] { background: var(--danger-soft); color: var(--danger); }
  .status[data-state="error"] .dot { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .35; } }

  .orb-wrap { position: relative; width: min(320px, 72vw); aspect-ratio: 1; }
  canvas#orb { width: 100%; height: 100%; display: block; }

  .stage h2 { position: relative; margin: 0; font-size: 22px; font-weight: 700; text-align: center; }
  .stage .hint { position: relative; margin: -12px 0 0; color: var(--muted); font-size: 14px; text-align: center; max-width: 380px; line-height: 1.6; }

  .controls { position: relative; display: flex; gap: 10px; align-items: center; }
  .btn { border: 0; border-radius: 14px; padding: 13px 26px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; transition: transform .12s ease, background .2s ease, opacity .2s; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover:not(:disabled) { background: #107569; }
  .btn-danger { background: var(--danger-soft); color: var(--danger); }
  .btn-icon { width: 48px; height: 48px; padding: 0; justify-content: center; background: var(--surface-2); color: var(--text); }
  .btn-icon.muted { background: var(--danger-soft); color: var(--danger); }
  .hidden { display: none !important; }

  /* Transcript */
  .chat { display: flex; flex-direction: column; min-height: 520px; max-height: calc(100vh - 140px); }
  @media (max-width: 860px) { .chat { max-height: 520px; } }
  .chat-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); }
  .chat-head h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .chat-head button { border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; padding: 4px 8px; border-radius: 8px; }
  .chat-head button:hover { background: var(--surface-2); }
  .messages { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.7; max-width: 260px; }
  .empty .ico { width: 48px; height: 48px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; margin: 0 auto 10px; }
  .msg { display: flex; flex-direction: column; gap: 4px; max-width: 85%; }
  .msg .who { font-size: 12px; color: var(--muted); font-weight: 600; padding: 0 4px; }
  .msg .bubble { padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.65; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-start; }
  .msg.user .bubble { background: var(--user-soft); color: #1f2a6b; border-start-start-radius: 6px; }
  .msg.bot { align-self: flex-end; }
  .msg.bot .who { text-align: end; }
  .msg.bot .bubble { background: var(--surface-2); border-start-end-radius: 6px; }
  .msg.bot.live .bubble::after { content: "▍"; color: var(--accent); animation: pulse 1s infinite; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow); z-index: 10; }
  footer { text-align: center; color: var(--muted); font-size: 12px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2.5 4 5.5v6c0 5 3.4 8.9 8 10 4.6-1.1 8-5 8-10v-6l-8-3Z" fill="#fff" opacity=".95"/><path d="m8.5 12 2.4 2.4 4.6-4.8" stroke="#0e9384" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <h1 data-i18n="company"></h1>
        <p data-i18n="tagline"></p>
      </div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ar">ع</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main>
    <section class="card stage">
      <div class="status" id="status" data-state="idle"><span class="dot"></span><span id="statusText"></span></div>
      <div class="orb-wrap"><canvas id="orb" width="640" height="640"></canvas></div>
      <h2 id="headline"></h2>
      <p class="hint" id="hint"></p>
      <div class="controls">
        <button class="btn btn-primary" id="connectBtn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
          <span data-i18n="connect"></span>
        </button>
        <button class="btn btn-icon hidden" id="muteBtn" type="button" aria-pressed="false">
          <svg id="micOn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
          <svg id="micOff" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m3 3 18 18M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.7-1.3M19 11a7 7 0 0 1-1.2 3.9M5 11a7 7 0 0 0 10.6 6M12 18v3"/></svg>
        </button>
        <button class="btn btn-danger hidden" id="endBtn" type="button"><span data-i18n="end"></span></button>
      </div>
    </section>

    <section class="card chat">
      <div class="chat-head">
        <h3 data-i18n="conversation"></h3>
        <button type="button" id="clearBtn" data-i18n="clear"></button>
      </div>
      <div class="messages" id="messages">
        <div class="empty" id="empty">
          <div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg></div>
          <span data-i18n="empty"></span>
        </div>
      </div>
    </section>
  </main>

  <footer><span data-i18n="footer"></span></footer>
</div>
<audio id="botAudio" autoplay playsinline></audio>
<div class="toast hidden" id="toast"></div>

<script>
(() => {
  // ---------- Text in both languages ----------
  const T = {
    ar: {
      company: "المستقبل للسلامة العامة",
      tagline: "المساعد الصوتي لخدمة العملاء",
      connect: "ابدأ المحادثة",
      connecting: "جارٍ الاتصال…",
      end: "إنهاء",
      conversation: "المحادثة",
      clear: "مسح",
      empty: "اضغط «ابدأ المحادثة» وتحدّث مع المساعد. ستظهر المحادثة هنا.",
      you: "أنت",
      assistant: "المساعد",
      footer: "نسخة تجريبية لأغراض تعليمية",
      classic: "الواجهة القديمة",
      s_idle: "غير متصل", s_connecting: "جارٍ الاتصال", s_connected: "متصل",
      s_listening: "يستمع إليك", s_speaking: "يتحدث", s_error: "حدث خطأ",
      h_idle: "كيف يمكننا مساعدتك؟", h_connecting: "لحظة من فضلك…",
      h_connected: "تفضّل، أنا أسمعك", h_listening: "أسمعك…", h_speaking: "المساعد يتحدث",
      h_error: "تعذّر الاتصال",
      hint_idle: "اسأل عن خدماتنا، الأسعار، أوقات الدوام أو الدورات التدريبية.",
      hint_live: "تكلّم بشكل طبيعي، وتوقّف قليلاً عندما تنتهي.",
      hint_error: "تأكّد أن البوت يعمل في Terminal ثم حاول مرة أخرى.",
      micDenied: "لم يتم السماح باستخدام الميكروفون. اسمح به من إعدادات المتصفح.",
      failed: "تعذّر الاتصال بالبوت. تأكد أنه يعمل في Terminal.",
      mute: "كتم الميكروفون", unmute: "تشغيل الميكروفون",
    },
    en: {
      company: "Al-Mustaqbal Public Safety",
      tagline: "Customer service voice assistant",
      connect: "Start conversation",
      connecting: "Connecting…",
      end: "End",
      conversation: "Conversation",
      clear: "Clear",
      empty: "Press “Start conversation” and talk to the assistant. The conversation will appear here.",
      you: "You",
      assistant: "Assistant",
      footer: "Demo for educational purposes",
      classic: "Classic interface",
      s_idle: "Offline", s_connecting: "Connecting", s_connected: "Connected",
      s_listening: "Listening", s_speaking: "Speaking", s_error: "Error",
      h_idle: "How can we help you?", h_connecting: "One moment…",
      h_connected: "Go ahead, I'm listening", h_listening: "Listening…", h_speaking: "The assistant is speaking",
      h_error: "Couldn't connect",
      hint_idle: "Ask about our services, prices, working hours or training courses.",
      hint_live: "Speak naturally and pause briefly when you're done.",
      hint_error: "Make sure the bot is running in Terminal, then try again.",
      micDenied: "Microphone access was blocked. Allow it in your browser settings.",
      failed: "Couldn't reach the bot. Make sure it is running in Terminal.",
      mute: "Mute microphone", unmute: "Unmute microphone",
    },
  };

  const $ = (id) => document.getElementById(id);
  const els = {
    status: $("status"), statusText: $("statusText"), headline: $("headline"), hint: $("hint"),
    connectBtn: $("connectBtn"), muteBtn: $("muteBtn"), endBtn: $("endBtn"), micOn: $("micOn"), micOff: $("micOff"),
    messages: $("messages"), empty: $("empty"), clearBtn: $("clearBtn"), audio: $("botAudio"), toast: $("toast"),
  };

  let lang = "ar";
  try { lang = localStorage.getItem("ui-lang") || "ar"; } catch (e) {}
  let state = "idle";

  function t(key) { return (T[lang] && T[lang][key]) || T.en[key] || key; }

  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-lang]").forEach((b) => b.classList.toggle("active", b.dataset.lang === lang));
    document.querySelectorAll(".msg").forEach((m) => { m.querySelector(".who").textContent = t(m.classList.contains("user") ? "you" : "assistant"); });
    els.muteBtn.title = t(muted ? "unmute" : "mute");
    renderState();
  }
  document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("ui-lang", lang); } catch (e) {}
    applyLang();
  }));

  function setState(s) { state = s; renderState(); }
  function renderState() {
    els.status.dataset.state = state;
    els.statusText.textContent = t("s_" + state);
    els.headline.textContent = t("h_" + state);
    els.hint.textContent = t(state === "idle" ? "hint_idle" : state === "error" ? "hint_error" : state === "connecting" ? "hint_idle" : "hint_live");
    const live = ["connected", "listening", "speaking"].includes(state);
    els.connectBtn.classList.toggle("hidden", live);
    els.connectBtn.disabled = state === "connecting";
    els.connectBtn.querySelector("span").textContent = t(state === "connecting" ? "connecting" : "connect");
    els.muteBtn.classList.toggle("hidden", !live);
    els.endBtn.classList.toggle("hidden", !live);
  }

  let toastTimer;
  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.add("hidden"), 5000);
  }

  // ---------- Transcript ----------
  let liveBot = null;
  function addMessage(role, text) {
    els.empty.classList.add("hidden");
    const wrap = document.createElement("div");
    wrap.className = "msg " + role;
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = t(role === "user" ? "you" : "assistant");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.dir = "auto";
    bubble.textContent = text;
    wrap.append(who, bubble);
    els.messages.appendChild(wrap);
    els.messages.scrollTop = els.messages.scrollHeight;
    return wrap;
  }
  function botStart() { if (!liveBot) { liveBot = addMessage("bot", ""); liveBot.classList.add("live"); } }
  function botAppend(text) {
    botStart();
    liveBot.querySelector(".bubble").textContent += text;
    els.messages.scrollTop = els.messages.scrollHeight;
  }
  function botEnd() {
    if (!liveBot) return;
    liveBot.classList.remove("live");
    if (!liveBot.querySelector(".bubble").textContent.trim()) liveBot.remove();
    liveBot = null;
  }
  els.clearBtn.addEventListener("click", () => {
    els.messages.querySelectorAll(".msg").forEach((m) => m.remove());
    liveBot = null;
    els.empty.classList.remove("hidden");
  });

  // ---------- Audio levels for the orb ----------
  let audioCtx = null, micAnalyser = null, botAnalyser = null;
  function makeAnalyser(stream) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    const an = audioCtx.createAnalyser();
    an.fftSize = 512;
    src.connect(an);
    return an;
  }
  const buf = new Uint8Array(512);
  function level(an) {
    if (!an) return 0;
    an.getByteTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < an.fftSize; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
    return Math.min(1, Math.sqrt(sum / an.fftSize) * 4);
  }

  const canvas = $("orb");
  const ctx = canvas.getContext("2d");
  let userLvl = 0, botLvl = 0, tick = 0;
  function draw() {
    tick += 0.012;
    userLvl += ((muted ? 0 : level(micAnalyser)) - userLvl) * 0.2;
    botLvl += (level(botAnalyser) - botLvl) * 0.2;
    const W = canvas.width, H = canvas.height, cx = W / 2, cy = H / 2;
    ctx.clearRect(0, 0, W, H);
    const live = ["connected", "listening", "speaking"].includes(state);
    const energy = live ? Math.max(userLvl, botLvl) : 0;
    const botLead = botLvl >= userLvl;
    const c1 = botLead ? [14, 147, 132] : [97, 114, 243];
    const c2 = botLead ? [97, 114, 243] : [14, 147, 132];
    const base = W * 0.26 * (1 + energy * 0.25 + Math.sin(tick * 2) * 0.015);

    // soft rings
    for (let r = 3; r >= 1; r--) {
      ctx.beginPath();
      ctx.arc(cx, cy, base * (1 + r * 0.17 + energy * 0.12 * r), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${c1.join(",")},${(live ? 0.05 : 0.03) + energy * 0.04})`;
      ctx.fill();
    }
    // blob
    ctx.beginPath();
    const pts = 96;
    for (let i = 0; i <= pts; i++) {
      const a = (i / pts) * Math.PI * 2;
      const wob = Math.sin(a * 3 + tick * 3) * 0.035 + Math.sin(a * 5 - tick * 2) * 0.025;
      const r = base * (1 + wob * (0.4 + energy * 2.2));
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    const g = ctx.createLinearGradient(cx - base, cy - base, cx + base, cy + base);
    g.addColorStop(0, `rgb(${c1.join(",")})`);
    g.addColorStop(1, `rgb(${c2.join(",")})`);
    ctx.fillStyle = live ? g : "#d0d5dd";
    ctx.fill();
    // highlight
    const hl = ctx.createRadialGradient(cx - base * 0.35, cy - base * 0.4, 0, cx - base * 0.35, cy - base * 0.4, base);
    hl.addColorStop(0, "rgba(255,255,255,.55)");
    hl.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = hl;
    ctx.fill();
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // ---------- WebRTC connection to the Pipecat bot ----------
  let pc = null, dc = null, micStream = null, pingTimer = null, muted = false;
  const sources = { user: null, bot: null }; // first message type seen wins, avoids duplicates

  function uid() { return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); }
  function sendRTVI(type, data) {
    if (dc && dc.readyState === "open") dc.send(JSON.stringify({ label: "rtvi-ai", type, id: uid(), data }));
  }

  function waitForIce(pc, ms) {
    if (pc.iceGatheringState === "complete") return Promise.resolve();
    return new Promise((res) => {
      const done = () => { pc.removeEventListener("icegatheringstatechange", check); res(); };
      const check = () => { if (pc.iceGatheringState === "complete") done(); };
      pc.addEventListener("icegatheringstatechange", check);
      setTimeout(done, ms);
    });
  }

  function onMessage(ev) {
    if (typeof ev.data !== "string") return;
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (!msg || msg.label !== "rtvi-ai") return;
    const d = msg.data || {};
    switch (msg.type) {
      case "bot-ready": setState("connected"); break;
      case "user-started-speaking": if (state !== "speaking") setState("listening"); break;
      case "user-stopped-speaking": if (state === "listening") setState("connected"); break;
      case "bot-started-speaking": setState("speaking"); break;
      case "bot-stopped-speaking": setState("connected"); break;
      case "user-transcription":
      case "stt-raw-text":
        sources.user = sources.user || msg.type;
        if (sources.user === msg.type && d.final && d.text && d.text.trim()) { botEnd(); addMessage("user", d.text.trim()); }
        break;
      case "bot-llm-started": botStart(); break;
      case "bot-llm-text":
      case "llm-raw-text":
        sources.bot = sources.bot || msg.type;
        if (sources.bot === msg.type && d.text) botAppend(d.text);
        break;
      case "bot-llm-stopped": botEnd(); break;
      case "error": if (d.message) toast(d.message); break;
    }
  }

  async function connect() {
    if (pc) return;
    setState("connecting");
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
    } catch (e) {
      setState("error"); toast(t("micDenied")); return;
    }
    try {
      pc = new RTCPeerConnection({ iceServers: [] });
      dc = pc.createDataChannel("chat", { ordered: true });
      dc.onopen = () => {
        sendRTVI("client-ready", { version: "2.3.0", about: { library: "almustaqbal-ui", library_version: "1.0.0" } });
        pingTimer = setInterval(() => { if (dc.readyState === "open") dc.send("ping: " + Date.now()); }, 1000);
      };
      dc.onmessage = onMessage;

      // Transceiver order matters to the bot: audio, video, screen.
      pc.addTransceiver(micStream.getAudioTracks()[0], { direction: "sendrecv", streams: [micStream] });
      pc.addTransceiver("video", { direction: "sendrecv" });
      pc.addTransceiver("video", { direction: "sendrecv" });

      pc.ontrack = (e) => {
        if (e.track.kind !== "audio") return;
        const stream = new MediaStream([e.track]);
        els.audio.srcObject = stream;
        els.audio.play().catch(() => {});
        try { botAnalyser = makeAnalyser(stream); } catch (err) {}
      };
      pc.onconnectionstatechange = () => {
        const s = pc && pc.connectionState;
        if (s === "connected" && state === "connecting") setState("connected");
        if (s === "failed" || s === "closed" || s === "disconnected") {
          const wasConnecting = state === "connecting";
          disconnect(false);
          if (s === "failed" || wasConnecting) { setState("error"); toast(t("failed")); }
        }
      };

      try { micAnalyser = makeAnalyser(micStream); if (audioCtx.state === "suspended") await audioCtx.resume(); } catch (err) {}

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitForIce(pc, 2500);

      const res = await fetch("/api/offer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
      });
      if (!res.ok) throw new Error("offer failed: " + res.status);
      const answer = await res.json();
      await pc.setRemoteDescription({ sdp: answer.sdp, type: answer.type });
    } catch (e) {
      console.error(e);
      disconnect(false);
      setState("error"); toast(t("failed"));
    }
  }

  function disconnect(sayBye = true) {
    if (sayBye) sendRTVI("disconnect-bot", {});
    clearInterval(pingTimer); pingTimer = null;
    botEnd();
    const p = pc; pc = null;
    if (dc) { try { dc.close(); } catch (e) {} dc = null; }
    if (p) { try { p.close(); } catch (e) {} }
    if (micStream) { micStream.getTracks().forEach((tr) => tr.stop()); micStream = null; }
    els.audio.srcObject = null;
    micAnalyser = null; botAnalyser = null;
    sources.user = null; sources.bot = null;
    muted = false; updateMute();
    setState("idle");
  }

  function updateMute() {
    if (micStream) micStream.getAudioTracks().forEach((tr) => { tr.enabled = !muted; });
    els.muteBtn.classList.toggle("muted", muted);
    els.muteBtn.setAttribute("aria-pressed", String(muted));
    els.muteBtn.title = t(muted ? "unmute" : "mute");
    els.micOn.classList.toggle("hidden", muted);
    els.micOff.classList.toggle("hidden", !muted);
  }

  els.connectBtn.addEventListener("click", connect);
  els.endBtn.addEventListener("click", () => disconnect(true));
  els.muteBtn.addEventListener("click", () => { muted = !muted; updateMute(); });
  window.addEventListener("beforeunload", () => { if (pc) disconnect(true); });

  applyLang();
})();
</script>
</body>
</html>
